[package]
name = "simwheel-bridge"
version = "0.1.0"
edition = "2021"
description = "Native FFB bridge sidecar for Aeronautics SimWheel: speaks the AWFB UDP protocol, drives a PID wheelbase (MOZA R9 and friends) via DirectInput on Windows or evdev on Linux"
license = "MIT"

# Unix-wide (not just Linux): the signal handler needs it on macOS too, where
# the sidecar runs in --sim mode for the cross-language conformance tests.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
]

[profile.release]
opt-level = 2
panic = "abort"
