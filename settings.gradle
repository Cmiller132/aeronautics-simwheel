pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Auto-provisions the right JDK for toolchains if the host doesn't have it
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'aeronautics-simwheel'

// engine/ = hal + ffb, pure JVM, zero Minecraft imports (DESIGN.md §4 — enforced
// here by module boundary instead of a source set: the engine literally cannot
// see Minecraft). mod/ = thin NeoForge adapters around it.
include 'engine'
include 'mod'
