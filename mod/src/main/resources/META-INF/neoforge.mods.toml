modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Cmiller132/aeronautics-simwheel/issues"

# The one mixin (Phase 3 mount linking): degrade-to-stock (defaultRequire 0),
# health-checked at startup — see DESIGN.md §5.5 / §10.4.
[[mixins]]
config = "aeronautics_simwheel.mixins.json"

[[mods]]
modId = "aeronautics_simwheel"
version = "0.3.0"
displayName = "Aeronautics SimWheel"
description = '''Sim racing wheel input and true force feedback for Create: Simulated / Aeronautics. Targets the MOZA R9 and any DirectInput/PID FFB wheel.'''
authors = "Cmiller132"

[[dependencies.aeronautics_simwheel]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.aeronautics_simwheel]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.aeronautics_simwheel]]
modId = "create"
type = "required"
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.aeronautics_simwheel]]
modId = "simulated"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

# Hard dependency since Phase 2a: GroundTelemetrySampler imports wheel-mount
# classes at the top level (a missing Offroad would be NoClassDefFoundError,
# which no reflection fallback catches).
[[dependencies.aeronautics_simwheel]]
modId = "offroad"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

# The physics engine: BlockEntitySubLevelActor, Sable.HELPER pose transforms.
[[dependencies.aeronautics_simwheel]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"
