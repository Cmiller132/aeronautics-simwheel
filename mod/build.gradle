plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.248'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        aeronautics_simwheel {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':engine')
}

// The engine classes ship inside the mod jar (single artifact, DESIGN.md §4)
jar {
    from(project(':engine').sourceSets.main.output)
}
