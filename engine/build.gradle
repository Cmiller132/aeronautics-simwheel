plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // GLFW comes from LWJGL, not Minecraft — allowed in hal/ (DESIGN.md §4).
    // compileOnly: at runtime Minecraft's own LWJGL provides it; tests never touch it.
    compileOnly 'org.lwjgl:lwjgl-glfw:3.3.3'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// Headless FFB driving scenario (DESIGN.md §10.5): ./gradlew :engine:drivingDemo
tasks.register('drivingDemo', JavaExec) {
    group = 'verification'
    description = 'Run the race car FFB simulation over block terrain, write CSV trace'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.aeronauticssimwheel.sim.DrivingScenarioDemo'
    args = [project.layout.buildDirectory.file('driving-sim.csv').get().asFile.path]
}
